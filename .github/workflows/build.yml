name: Build TWRP Recovery

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cleanup Environment and Install Dependencies
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf libxml2-utils xsltproc zip zlib1g-dev libncurses5-dev libncurses5 python2 python2-dev python3 python-is-python3
          
          # Forza il comando 'python' a puntare a Python 2 per la compatibilità con TWRP 9.0
          sudo ln -sf /usr/bin/python2 /usr/bin/python

      - name: Install Repo
        run: |
          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          sudo ln -sf ~/bin/repo /usr/bin/repo

      - name: Initialize Repo and Sync
        run: |
          mkdir twrp
          cd twrp
          repo init -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_omni.git -b twrp-9.0 --depth=1
          repo sync -c -j$(nproc --all) --force-sync --no-clone-bundle --no-tags

      - name: Clone Device Tree
        run: |
          cd twrp
          git clone ${{ github.server_url }}/${{ github.repository }}.git -b main device_temp
          mkdir -p device/wiko/W_K510
          cp -r device_temp/device/wiko/W_K510/* device/wiko/W_K510/
          rm -rf device_temp

      - name: Build Recovery
        run: |
          cd twrp
          source build/envsetup.sh
          export ALLOW_MISSING_DEPENDENCIES=true
          lunch omni_W_K510-eng || lunch omni_W_K510-userdebug
          make recoveryimage -j$(nproc --all)

      - name: Upload Recovery Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TWRP_Wiko_Y60
          path: |
            twrp/out/target/product/W_K510/recovery.img
            twrp/out/target/product/W_K510/*.imgg
            twrp/out/target/product/W_K510/*.img

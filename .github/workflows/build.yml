name: Build TWRP Recovery

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cleanup Environment and Install Dependencies
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf libxml2-utils xsltproc zip zlib1g-dev libncurses5-dev libncurses5 python3 python-is-python3

      - name: Install Repo
        run: |
          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          sudo ln -sf ~/bin/repo /usr/bin/repo

      - name: Initialize Repo and Sync
        run: |
          mkdir twrp
          cd twrp
          repo init -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_omni.git -b twrp-9.0 --depth=1
          repo sync -c -j$(nproc --all) --force-sync --no-clone-bundle --no-tags

      - name: Clone Device Tree and Fix Configs
        run: |
          cd twrp
          git clone ${{ github.server_url }}/${{ github.repository }}.git -b main device/wiko/W_K510
          cd device/wiko/W_K510
          
          # Assicuriamoci che esistano i file sia con '_' che con '-'
          if [ -f omni_W-K510.mk ]; then
            cp omni_W-K510.mk omni_W_K510.mk
          fi
          if [ -f omni_W_K510.mk ]; then
            cp omni_W_K510.mk omni_W-K510.mk
          fi

          # Crea un file omni.dependencies vuoto per disattivare roomservice
          echo "[]" > omni.dependencies

          # Corregge i nomi dentro i file di configurazione
          sed -i 's/omni_W-K510/omni_W_K510/g' AndroidProducts.mk 2>/dev/null || true
          sed -i 's/omni_W-K510/omni_W_K510/g' omni_W_K510.mk 2>/dev/null || true

          # Aggiunge una copia in AndroidProducts.mk se non c'è
          if ! grep -q "omni_W_K510.mk" AndroidProducts.mk; then
            echo 'PRODUCT_MAKEFILES += $(LOCAL_DIR)/omni_W_K510.mk' >> AndroidProducts.mk
          fi

      - name: Build Recovery
        run: |
          cd twrp
          source build/envsetup.sh
          export ALLOW_MISSING_DEPENDENCIES=true
          
          # Seleziona il prodotto direttamente evitando il trigger di roomservice
          lunch omni_W_K510-eng || lunch omni_W_K510-userdebug || {
            export TARGET_PRODUCT=omni_W_K510
            export TARGET_BUILD_VARIANT=eng
            lunch omni_W_K510-eng
          }
          
          make recoveryimage -j$(nproc --all)

      - name: Upload Recovery Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TWRP_Wiko_Y60
          path: |
            twrp/out/target/product/W_K510/recovery.img
            twrp/out/target/product/W_K510/*.img
